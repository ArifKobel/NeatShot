name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version from tag
        id: version
        shell: pwsh
        run: '"value=$($env:GITHUB_REF_NAME.TrimStart(''v''))" >> $env:GITHUB_OUTPUT'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Publish
        run: >
          dotnet publish src/NeatShot.App --configuration Release
          --runtime win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:PublishDocumentationFiles=false
          -p:Version=${{ steps.version.outputs.value }}
          --output artifacts/publish

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.value }} installer/NeatShot.iss'

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/NeatShot-${{ steps.version.outputs.value }}-portable.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: NeatShot ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            artifacts/NeatShot-${{ steps.version.outputs.value }}-Setup.exe
            artifacts/NeatShot-${{ steps.version.outputs.value }}-portable.zip
